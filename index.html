<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry — find what to cook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-shade:#F1EADA;
    --ink:#23201B;
    --ink-soft:#585349;
    --pantry:#2B3A2F;
    --pantry-light:#3E5245;
    --butter:#F0BB3D;
    --tomato:#C1440E;
    --sage:#93A98A;
    --sage-30:rgba(147,169,138,.35);
    --card:#FFFDF7;
    --line:#DCD3BE;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,32,27,.04) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{ outline:3px solid var(--tomato); outline-offset:2px; }

  /* ---------- header ---------- */
  header.top{
    background:var(--pantry);
    color:var(--paper);
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky; top:0; z-index:40;
    border-bottom:4px solid var(--butter);
  }
  .wordmark{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.08em;
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .dot{color:var(--tomato);}
  .top-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--sage);
    letter-spacing:.05em;
  }

  /* ---------- hero ---------- */
  .hero{
    max-width:960px;
    margin:0 auto;
    padding:56px 24px 32px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--tomato);
    letter-spacing:.1em;
    margin-bottom:10px;
  }
  .hero h1{
    font-size:clamp(34px,5vw,54px);
    line-height:1.02;
    font-weight:700;
    color:var(--pantry);
    max-width:14ch;
  }
  .hero p.lede{
    font-size:18px;
    color:var(--ink-soft);
    max-width:56ch;
    margin-top:14px;
  }

  /* ingredient input */
  .builder{
    margin-top:32px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px;
    box-shadow:5px 5px 0 var(--sage-30);
  }
  .builder label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .chip-input-row{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    border-bottom:1px dashed var(--line);
    padding-bottom:14px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--pantry);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:6px 8px 6px 12px;
    border-radius:999px;
  }
  .chip button{
    background:none;border:none;color:var(--paper);
    font-size:14px;line-height:1;opacity:.7;padding:2px;
  }
  .chip button:hover{opacity:1;color:var(--butter);}
  #ingredientInput{
    flex:1; min-width:180px;
    border:none; outline:none;
    background:transparent;
    font-family:'Source Serif 4', serif;
    font-size:16px;
    padding:6px 4px;
    color:var(--ink);
  }
  .suggest-row{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-top:10px;
  }
  .suggest-row button{
    background:var(--paper-shade);
    border:1px solid var(--line);
    border-radius:999px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:5px 10px;
    color:var(--ink-soft);
  }
  .suggest-row button:hover{ border-color:var(--sage); color:var(--pantry); }

  .filters-row{
    display:flex; gap:16px; flex-wrap:wrap;
    margin-top:16px;
  }
  .filter-group{ min-width:150px; }
  select{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
  }
  .filters-row .filter-group:last-child{
    margin-left:auto;
    display:flex; align-items:flex-end;
  }
  .btn-find{
    background:var(--tomato);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:11px 20px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .btn-find:hover{ background:#a63a0c; }

  .result-count{
    max-width:960px;
    margin:0 auto;
    padding:0 24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:10px;
  }
  .result-count .n{ color:var(--tomato); font-weight:600; }

  /* ---------- results grid ---------- */
  .grid{
    max-width:960px;
    margin:20px auto 80px;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:22px;
  }
  .rcard{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:4px 4px 0 var(--sage-30);
    padding:18px 16px 16px;
    display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  .rcard:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--sage-30);
  }
  .punchline{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px dashed var(--line);
    padding-bottom:10px; margin-bottom:10px;
  }
  .punch-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .rcard .cuisine-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--tomato);
  }
  .rcard h3{
    font-size:19px;
    color:var(--pantry);
    line-height:1.15;
    margin:2px 0 10px;
  }
  .rcard .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex; gap:12px; margin-bottom:10px;
  }
  .match-bar-wrap{
    height:5px; background:var(--paper-shade);
    border-radius:3px; overflow:hidden; margin-bottom:8px;
  }
  .match-bar{
    height:100%; background:var(--sage);
  }
  .match-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-soft); margin-bottom:12px;
  }
  .rcard button.open{
    margin-top:auto;
    background:var(--pantry);
    color:var(--paper);
    border:none; border-radius:3px;
    padding:9px 12px;
    font-family:'Oswald', sans-serif;
    font-size:12.5px; letter-spacing:.04em; text-transform:uppercase;
    font-weight:600;
  }
  .rcard button.open:hover{ background:var(--pantry-light); }

  .empty-state{
    max-width:520px; margin:60px auto; text-align:center;
    padding:0 24px;
  }
  .empty-state .display{ font-size:22px; color:var(--pantry); margin-bottom:8px;}
  .empty-state p{ color:var(--ink-soft); }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(35,32,27,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--card);
    max-width:640px; width:100%;
    border-radius:6px;
    padding:0;
    position:relative;
    box-shadow:8px 8px 0 rgba(43,58,47,.25);
    animation:pop .15s ease;
  }
  @keyframes pop{ from{ transform:translateY(8px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-head{
    background:var(--pantry); color:var(--paper);
    padding:22px 26px; border-radius:6px 6px 0 0;
    border-bottom:4px solid var(--butter);
  }
  .modal-head .cuisine-tag{ color:var(--butter); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em;}
  .modal-head h2{ font-size:26px; margin-top:6px; }
  .modal-close{
    position:absolute; top:16px; right:16px;
    background:transparent; border:1px solid var(--sage);
    color:var(--paper); width:30px; height:30px; border-radius:50%;
    font-size:16px; line-height:1;
  }
  .modal-close:hover{ background:var(--tomato); border-color:var(--tomato); }
  .modal-body{ padding:24px 26px 30px; }
  .servings-row{
    display:flex; align-items:center; gap:12px;
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    margin-bottom:20px; color:var(--ink-soft);
  }
  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper);
    font-size:15px; color:var(--pantry);
  }
  .stepper button:hover{ border-color:var(--sage); }
  .stepper .n{ min-width:16px; text-align:center; color:var(--ink); font-weight:600; }

  .modal-body h4{
    font-size:13px; color:var(--tomato); letter-spacing:.08em; margin-bottom:10px;
  }
  .ingredient-list{
    list-style:none; margin:0 0 26px; padding:0;
    font-family:'IBM Plex Mono', monospace; font-size:14px;
  }
  .ingredient-list li{
    display:flex; justify-content:space-between;
    padding:7px 0; border-bottom:1px dotted var(--line);
  }
  .ingredient-list li.have{ color:var(--pantry); }
  .ingredient-list li .amt{ color:var(--ink-soft); }
  .ingredient-list li.have .amt{ color:var(--pantry); }
  .steps-list{ margin:0; padding:0; list-style:none; counter-reset:step; }
  .steps-list li{
    counter-increment:step;
    display:flex; gap:14px;
    margin-bottom:16px;
    line-height:1.55;
  }
  .steps-list li::before{
    content:counter(step);
    font-family:'Oswald', sans-serif;
    font-weight:700; font-size:14px;
    background:var(--butter); color:var(--pantry);
    min-width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  footer{
    text-align:center; padding:30px 20px 50px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; color:var(--ink-soft);
  }

  @media (max-width:600px){
    header.top{padding:14px 18px;}
    .filters-row .filter-group:last-child{ margin-left:0; width:100%; }
    .btn-find{ width:100%; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wordmark">PANTRY<span class="dot">.</span></div>
  <div class="top-tag">cook what you have</div>
</header>

<section class="hero">
  <div class="eyebrow">RECIPE FINDER</div>
  <h1>What's in your kitchen?</h1>
  <p class="lede">Add the ingredients you've got, pick a cuisine or a meal, and we'll sort every recipe by how close it is to ready.</p>

  <div class="builder">
    <label for="ingredientInput">Ingredients on hand</label>
    <div class="chip-input-row" id="chipRow">
      <input id="ingredientInput" type="text" placeholder="Type an ingredient and press Enter…" autocomplete="off">
    </div>
    <div class="suggest-row" id="suggestRow"></div>

    <div class="filters-row">
      <div class="filter-group">
        <label for="cuisineSelect">Cuisine</label>
        <select id="cuisineSelect"><option value="">Any cuisine</option></select>
      </div>
      <div class="filter-group">
        <label for="mealSelect">Meal</label>
        <select id="mealSelect"><option value="">Any meal</option></select>
      </div>
      <div class="filter-group">
        <label for="dietSelect">Diet</label>
        <select id="dietSelect"><option value="">Any diet</option></select>
      </div>
      <div class="filter-group">
        <button class="btn-find" id="findBtn">Find recipes</button>
      </div>
    </div>
  </div>
</section>

<div class="result-count" id="resultCount"></div>
<div class="grid" id="grid"></div>

<footer>Pantry — 30 built-in recipes, matched entirely in your browser. Nothing you type leaves this page.</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

const COMMON_INGREDIENTS = ["chicken breast","garlic","onion","tomato","rice","egg","pasta","cheese","olive oil","basil","ginger","soy sauce","spinach","lemon"];

/* ---------------- STATE ---------------- */
let chips = [];
let currentServings = {};

/* ---------------- SETUP ---------------- */
function uniqueSorted(arr){ return [...new Set(arr)].sort(); }

function populateSelect(id, values, defaultLabel){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

populateSelect('cuisineSelect', uniqueSorted(RECIPES.map(r=>r.cuisine)));
populateSelect('mealSelect', uniqueSorted(RECIPES.map(r=>r.meal)));
populateSelect('dietSelect', uniqueSorted(RECIPES.flatMap(r=>r.diet)));

const suggestRow = document.getElementById('suggestRow');
COMMON_INGREDIENTS.forEach(ing=>{
  const b = document.createElement('button');
  b.textContent = '+ ' + ing;
  b.addEventListener('click', ()=> addChip(ing));
  suggestRow.appendChild(b);
});

/* ---------------- CHIP INPUT ---------------- */
const chipRow = document.getElementById('chipRow');
const ingredientInput = document.getElementById('ingredientInput');

function renderChips(){
  chipRow.querySelectorAll('.chip').forEach(c=>c.remove());
  chips.forEach(name=>{
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${name} <button type="button" aria-label="Remove ${name}">×</button>`;
    chip.querySelector('button').addEventListener('click', ()=>{
      chips = chips.filter(c=>c!==name);
      renderChips();
      runSearch();
    });
    chipRow.insertBefore(chip, ingredientInput);
  });
}

function addChip(raw){
  const name = raw.trim().toLowerCase();
  if(!name || chips.includes(name)) return;
  chips.push(name);
  renderChips();
  runSearch();
}

ingredientInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    addChip(ingredientInput.value);
    ingredientInput.value = '';
  } else if(e.key === 'Backspace' && ingredientInput.value === '' && chips.length){
    chips.pop();
    renderChips();
    runSearch();
  }
});

document.getElementById('findBtn').addEventListener('click', runSearch);
document.getElementById('cuisineSelect').addEventListener('change', runSearch);
document.getElementById('mealSelect').addEventListener('change', runSearch);
document.getElementById('dietSelect').addEventListener('change', runSearch);

/* ---------------- SEARCH / MATCHING ---------------- */
function ingredientMatches(recipe){
  if(chips.length === 0) return {count:0, total:recipe.ingredients.length, haveSet:new Set()};
  const haveSet = new Set();
  recipe.ingredients.forEach(([name])=>{
    const lname = name.toLowerCase();
    if(chips.some(c=> lname.includes(c) || c.includes(lname))) haveSet.add(name);
  });
  return {count:haveSet.size, total:recipe.ingredients.length, haveSet};
}

function runSearch(){
  const cuisine = document.getElementById('cuisineSelect').value;
  const meal = document.getElementById('mealSelect').value;
  const diet = document.getElementById('dietSelect').value;

  let results = RECIPES.filter(r=>{
    if(cuisine && r.cuisine !== cuisine) return false;
    if(meal && r.meal !== meal) return false;
    if(diet && !r.diet.includes(diet)) return false;
    return true;
  }).map(r=>({recipe:r, match: ingredientMatches(r)}));

  if(chips.length > 0){
    results = results.filter(r=> r.match.count > 0);
    results.sort((a,b)=> (b.match.count/b.match.total) - (a.match.count/a.match.total));
  } else {
    results.sort((a,b)=> a.recipe.title.localeCompare(b.recipe.title));
  }

  renderResults(results);
}

/* ---------------- RENDER ---------------- */
const grid = document.getElementById('grid');
const resultCount = document.getElementById('resultCount');

function renderResults(results){
  grid.innerHTML = '';
  resultCount.innerHTML = results.length
    ? `<span class="n">${results.length}</span> recipe${results.length===1?'':'s'} found`
    : '';

  if(results.length === 0){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="display">Nothing matches — yet</div>
        <p>Try removing an ingredient or filter, or add a staple like garlic, onion or rice.</p>
      </div>`;
    return;
  }

  results.forEach(({recipe, match})=>{
    const card = document.createElement('div');
    card.className = 'rcard';
    const showMatch = chips.length > 0;
    card.innerHTML = `
      <div class="punchline">
        <span class="cuisine-tag">${recipe.cuisine} · ${recipe.meal}</span>
        <span class="punch-dot"></span>
      </div>
      <h3>${recipe.title}</h3>
      <div class="meta"><span>${recipe.time} min</span><span>${recipe.difficulty}</span><span>Serves ${recipe.servings}</span></div>
      ${showMatch ? `
        <div class="match-bar-wrap"><div class="match-bar" style="width:${(match.count/match.total*100).toFixed(0)}%"></div></div>
        <div class="match-label">${match.count}/${match.total} ingredients on hand</div>
      ` : `<div class="match-label">&nbsp;</div>`}
      <button class="open" type="button">View recipe</button>
    `;
    card.querySelector('.open').addEventListener('click', ()=> openModal(recipe));
    grid.appendChild(card);
  });
}

/* ---------------- MODAL ---------------- */
const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modalContent');

function openModal(recipe){
  currentServings[recipe.id] = currentServings[recipe.id] || recipe.servings;
  renderModal(recipe);
  overlay.classList.add('show');
}

function scaleAmount(amount, factor){
  const m = amount.match(/^([\d.\/]+)(.*)$/);
  if(!m) return amount;
  let num = m[1];
  let rest = m[2];
  let val;
  if(num.includes('/')){
    const [n,d] = num.split('/').map(Number);
    val = n/d;
  } else {
    val = parseFloat(num);
  }
  if(isNaN(val)) return amount;
  const scaled = val * factor;
  const rounded = Math.round(scaled * 100) / 100;
  return `${rounded}${rest}`;
}

function renderModal(recipe){
  const servings = currentServings[recipe.id];
  const factor = servings / recipe.servings;
  const match = ingredientMatches(recipe);

  modalContent.innerHTML = `
    <button class="modal-close" type="button" aria-label="Close">×</button>
    <div class="modal-head">
      <div class="cuisine-tag">${recipe.cuisine} · ${recipe.meal} · ${recipe.difficulty}</div>
      <h2>${recipe.title}</h2>
    </div>
    <div class="modal-body">
      <div class="servings-row">
        <span>Servings</span>
        <div class="stepper">
          <button type="button" id="servDown" aria-label="Fewer servings">−</button>
          <span class="n">${servings}</span>
          <button type="button" id="servUp" aria-label="More servings">+</button>
        </div>
        <span>·</span>
        <span>${recipe.time} min</span>
      </div>

      <h4>INGREDIENTS</h4>
      <ul class="ingredient-list">
        ${recipe.ingredients.map(([name,amount])=>{
          const have = match.haveSet.has(name);
          return `<li class="${have?'have':''}"><span>${have?'✓ ':''}${name}</span><span class="amt">${scaleAmount(amount, factor)}</span></li>`;
        }).join('')}
      </ul>

      <h4>STEPS</h4>
      <ol class="steps-list">
        ${recipe.steps.map(s=>`<li>${s}</li>`).join('')}
      </ol>
    </div>
  `;

  modalContent.querySelector('.modal-close').addEventListener('click', closeModal);
  modalContent.querySelector('#servDown').addEventListener('click', ()=>{
    if(currentServings[recipe.id] > 1){ currentServings[recipe.id]--; renderModal(recipe); }
  });
  modalContent.querySelector('#servUp').addEventListener('click', ()=>{
    currentServings[recipe.id]++; renderModal(recipe);
  });
}

function closeModal(){ overlay.classList.remove('show'); }
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

/* ---------------- INITIAL RENDER ---------------- */
runSearch();
</script>
